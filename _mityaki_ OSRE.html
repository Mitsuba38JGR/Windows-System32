<!DOCTYPE html>
<html lang="ja">
<head>

<title>_mityaki_ OS Secure Boot Manager</title>

<style>

  h1 {

  button {
    min-width: 320px;
    padding: 12px 16px;
    margin-bottom: 12px;

    color: #ffffff;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  button:hover {
    background: #ffffff;

  }

  /* フッター */
  footer {
    position: fixed;
    bottom: 8px;
    right: 16px;
